services:
  # Aplicação Laravel rodando em PHP-FPM
  app:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # URL base da PokeAPI consumida pela aplicação
      API_BASE_URL: https://pokeapi.co/api
    volumes:
      # Compartilha os estáticos do public/ com o Nginx (populado a partir da imagem)
      - public:/app/public
    restart: unless-stopped

  # Servidor web: serve estáticos e faz proxy do PHP para o PHP-FPM
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  public:
